<!DOCTYPE html>
<!-- xmlns:th：声明使用 Thymeleaf 的 th: 属性 -->
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>家計簿</title>
    <!-- Bootstrap：现成的样式库，让页面好看一些 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container py-4">

    <div class="d-flex justify-content-between align-items-center mb-3">
        <h1 class="h3 mb-0">記録一覧</h1>
        <a th:href="@{/transactions/new}" class="btn btn-primary">記録を追加</a>
    </div>

    <table class="table table-striped bg-white align-middle">
        <thead>
        <tr>
            <th>日付</th>
            <th>カテゴリー</th>
            <th class="text-end">金額</th>
            <th>メモ</th>
            <th></th>
        </tr>
        </thead>
        <tbody>
        <!-- th:each：遍历 transactions，每次把一条记账叫做 t，生成一行 <tr> -->
        <tr th:each="t : ${transactions}">
            <!-- th:text：把表达式的值显示在标签里 -->
            <td th:text="${t.transactionDate}"></td>
            <!-- categoryNames 是 Map，用 [键] 取值：键是这条记账的 categoryId -->
            <td th:text="${categoryNames[t.categoryId]}"></td>
            <!-- 金额：每三位加逗号，后面拼上"円" -->
            <td class="text-end" th:text="${#numbers.formatInteger(t.amount, 3, 'COMMA')} + ' 円'"></td>
            <td th:text="${t.memo}"></td>
            <td> <a th:href="@{/transactions/{id}/edit(id=${t.id})}" class="btn btn-sm btn-outline-primary">編集</a></td>
        </tr>
        <!-- th:if：条件成立才显示这一行。列表为空时提示没有记录 -->
        <tr th:if="${#lists.isEmpty(transactions)}">
            <td colspan="5" class="text-center text-muted">まだ記録がありません</td>
        </tr>
        </tbody>
    </table>

</div>
</body>
</html>
