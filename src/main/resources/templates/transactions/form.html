<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <!-- 标题用 Controller 传来的 pageTitle -->
    <title th:text="${pageTitle}">記録</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container py-4" style="max-width: 560px;">

    <h1 class="h3 mb-3" th:text="${pageTitle}">記録</h1>

    <!-- Service 抛出的错误（如分类不合法）显示在这里，没有错误时不显示 -->
    <div class="alert alert-danger" th:if="${errorMessage}" th:text="${errorMessage}"></div>

    <!-- th:action：提交地址（会自动带上 CSRF 令牌，没有它 POST 会被 Spring Security 拒绝）
         th:object：这个表单绑定的对象，对应 Controller 里放进 Model 的 transactionForm -->
    <form th:action="@{${formAction}}" th:object="${transactionForm}" method="post"
          class="bg-white p-4 rounded border">

        <!-- 分类下拉框 -->
        <div class="mb-3">
            <label class="form-label">カテゴリー</label>
            <!-- th:field="*{categoryId}"：绑定到表单对象的 categoryId 字段 -->
            <select th:field="*{categoryId}" class="form-select">
                <option value="">選択してください</option>
                <!-- 遍历分类，每个分类生成一个选项。value 是分类 id，显示的是"支出：食費"这样的文字 -->
                <option th:each="c : ${categories}"
                        th:value="${c.id}"
                        th:text="${(c.type.name() == 'EXPENSE' ? '支出' : '収入') + '：' + c.name}"></option>
            </select>
            <!-- th:errors：这个字段校验失败时，显示注解里写的 message -->
            <div class="text-danger small" th:errors="*{categoryId}"></div>
        </div>

        <!-- 金额 -->
        <div class="mb-3">
            <label class="form-label">金額（円）</label>
            <input type="number" th:field="*{amount}" class="form-control">
            <div class="text-danger small" th:errors="*{amount}"></div>
        </div>

        <!-- 日期：type="date" 是浏览器自带的日期选择器，提交格式是 2026-10-07 -->
        <div class="mb-3">
            <label class="form-label">日付</label>
            <input type="date" th:field="*{transactionDate}" class="form-control">
            <div class="text-danger small" th:errors="*{transactionDate}"></div>
        </div>

        <!-- 备注 -->
        <div class="mb-3">
            <label class="form-label">メモ</label>
            <input type="text" th:field="*{memo}" class="form-control">
            <div class="text-danger small" th:errors="*{memo}"></div>
        </div>

        <div class="d-flex gap-2">
            <button type="submit" class="btn btn-primary">保存</button>
            <a th:href="@{/transactions}" class="btn btn-outline-secondary">キャンセル</a>
        </div>
    </form>

</div>
</body>
</html>
