<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>新規登録</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container" style="max-width: 400px; margin-top: 60px;">
    <h2 class="mb-4">新規登録</h2>

    <div th:if="${errorMessage}" class="alert alert-danger" th:text="${errorMessage}"></div>

    <form th:action="@{/register}" th:object="${registerForm}" method="post">
        <div class="mb-3">
            <label class="form-label">メールアドレス</label>
            <input type="email" class="form-control" th:field="*{email}">
            <div class="text-danger" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>
        </div>
        <div class="mb-3">
            <label class="form-label">パスワード</label>
            <input type="password" class="form-control" th:field="*{password}">
            <div class="text-danger" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></div>
        </div>
        <div class="mb-3">
            <label class="form-label">パスワード（確認用）</label>
            <input type="password" class="form-control" th:field="*{confirmPassword}">
            <div class="text-danger" th:if="${#fields.hasErrors('confirmPassword')}" th:errors="*{confirmPassword}"></div>
        </div>
        <button type="submit" class="btn btn-primary w-100">登録する</button>
    </form>
    <p class="mt-3"><a th:href="@{/login}">既にアカウントをお持ちの方はこちら</a></p>
</div>
</body>
</html>
