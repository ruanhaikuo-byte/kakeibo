<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>ログイン</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container" style="max-width: 400px; margin-top: 60px;">
    <h2 class="mb-4">ログイン</h2>

    <div th:if="${param.registered}" class="alert alert-success">登録が完了しました。ログインしてください。</div>
    <div th:if="${param.error}" class="alert alert-danger">メールアドレスまたはパスワードが正しくありません。</div>

    <form th:action="@{/login}" method="post">
        <div class="mb-3">
            <label class="form-label">メールアドレス</label>
            <input type="email" name="username" class="form-control">
        </div>
        <div class="mb-3">
            <label class="form-label">パスワード</label>
            <input type="password" name="password" class="form-control">
        </div>
        <button type="submit" class="btn btn-primary w-100">ログイン</button>
    </form>
    <p class="mt-3"><a th:href="@{/register}">アカウントをお持ちでない方はこちら</a></p>
</div>
</body>
</html>
</parameter>
